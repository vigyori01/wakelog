<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wake Log</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wake Log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EAF0F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#081216" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone tool. Home = crew list + two capture buttons; capture opens a full-screen sheet ending in "Save to Files". */
:root{
  --bg:#EAF0F2; --surface:#FFFFFF; --ink:#0D1D25; --muted:#56686F; --line:#D0DADE;
  --accent:#E4521C; --accent-ink:#FFFFFF; --sea:#0E5A70; --sea-soft:#D6E7EC;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#081216; --surface:#10202A; --ink:#E3EDF0; --muted:#8FA2AA; --line:#21343E;
  --accent:#FF6630; --accent-ink:#1A0A03; --sea:#5DB8D0; --sea-soft:#14303A; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

.top .wrap{display:flex;align-items:center;gap:8px;padding-block:14px 4px}
.brand{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.brand svg{width:30px;height:30px;color:var(--accent)}

.capture{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-block:14px 0}
.cap{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:18px;min-height:150px;padding:16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);user-select:none;-webkit-user-select:none}
.cap.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.cap svg{width:34px;height:34px}
.cap b{display:block;font-family:var(--f-display);font-size:28px;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.cap span{font-size:14px;opacity:.85}
.cap:active{transform:scale(.98)}
.cap:focus-within{outline:3px solid var(--sea);outline-offset:2px}
.cap.off{opacity:.45;pointer-events:none}

.crew{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;margin-top:14px}
.crew-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.crew-title{font-family:var(--f-display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.03em}
.crew-title small{display:inline-block;white-space:nowrap;font-family:var(--f-body);font-weight:500;font-size:14px;color:var(--muted);text-transform:none;letter-spacing:0;margin-left:6px}
.crew-list{display:flex;flex-wrap:wrap;gap:8px}
.sailor{display:inline-flex;align-items:center;gap:4px;padding:4px 4px 4px 12px;border-radius:10px;background:var(--sea-soft);max-width:100%}
.sailor b{font-weight:600;overflow-wrap:anywhere}
.x{width:34px;height:34px;border-radius:8px;border:0;background:transparent;color:var(--muted);font-size:22px;line-height:1;flex:none}
.crew-empty{font-size:14px;color:var(--muted)}
.crew-add{display:grid;grid-template-columns:1fr auto;gap:8px}
.crew-add input{height:46px;min-width:0;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 12px}
.addbtn{height:46px;padding:0 18px;border-radius:10px;border:0;background:var(--ink);color:var(--bg);font-weight:600}
.small-link{white-space:nowrap;background:none;border:0;color:var(--muted);font-size:14px;font-weight:600;padding:6px 2px}
.small-link.armed{color:var(--accent)}
.foot{font-size:13px;color:var(--muted);padding-block:18px 28px}

.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px)}
.sheet-head .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px}
.sheet-title{font-family:var(--f-display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.03em}
.link{background:none;border:0;color:var(--sea);font-weight:600;padding:8px 4px;min-width:72px;text-align:left}
.link.armed{color:var(--accent)}
.preview{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3;max-width:100%}
.preview img,.preview video{width:100%;height:100%;object-fit:contain;display:block}
.retake{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;border-radius:8px;padding:6px 12px;font-weight:600;font-size:14px}
.sec{padding-block:18px 0;display:flex;flex-direction:column;gap:10px}
.lbl{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.req{color:var(--accent);font-size:13px;letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:46px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:16px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips.big .chip{flex:1 1 calc(50% - 4px);min-height:58px;font-family:var(--f-display);font-size:20px;text-transform:uppercase;letter-spacing:.03em}
.chips.big .chip.wide{flex-basis:100%}
.chip:disabled{opacity:.35}
.crew-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.pick{min-height:60px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;padding:8px 12px;font-size:18px;font-weight:600;line-height:1.2;overflow-wrap:anywhere;display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.pick::after{content:"";width:20px;height:20px;border-radius:6px;border:2px solid var(--line);flex:none}
.pick[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pick[aria-pressed="true"]::after{background:var(--accent);border-color:var(--accent)}
.pick-note{font-size:14px;color:var(--muted)}
.wind{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.wind-read{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.kn{font-family:var(--f-display);font-weight:700;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.kn small{font-size:22px;font-weight:600;margin-left:4px;color:var(--muted)}
.bft{text-align:right;font-size:14px;color:var(--muted)}
.bft b{display:block;font-family:var(--f-display);font-size:22px;color:var(--sea);text-transform:uppercase}
.wind-ctl{display:grid;grid-template-columns:52px 1fr 52px;gap:10px;align-items:center;margin-top:10px}
.step{height:52px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:26px;font-weight:600;line-height:1}
input[type=range]{width:100%;accent-color:var(--accent);height:40px;margin:0}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding:0 62px}
.fname-box{margin-top:20px;padding:12px;border-radius:10px;background:var(--sea-soft)}
.fname-box .lbl{color:var(--sea)}
.fname{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13px;line-height:1.45;overflow-wrap:anywhere;margin-top:4px}
.savebar{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);margin-top:22px;padding-bottom:env(safe-area-inset-bottom,0px)}
.savebar .wrap{display:flex;gap:10px;align-items:center;padding-block:12px}
.save{flex:1;height:58px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:700;font-size:24px;text-transform:uppercase;letter-spacing:.04em}
.save:disabled{opacity:.4}
.hint{font-size:14px;color:var(--muted);min-width:0;flex:0 1 45%}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;width:max-content;max-width:calc(100% - 32px);overflow-wrap:anywhere;font-size:14px}
@media (prefers-reduced-motion: no-preference){.cap,.chip,.pick,.save{transition:transform .08s,background-color .12s}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand">
    <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3v20M16 4l9 17H16M16 7 9 21h7"/><path d="M5 25c2.5 2 5 2 7.5 0s5-2 7.5 0 5 2 7 0"/></svg>
    Wake Log
  </div>
</div></header>

<main class="wrap">
  <section class="crew" aria-labelledby="crew-title">
    <div class="crew-head">
      <div class="crew-title" id="crew-title">Training session<small id="crew-count"></small></div>
      <button class="small-link" id="crew-clear" type="button" hidden>Clear all</button>
    </div>
    <div class="crew-list" id="crew-list"></div>
    <form class="crew-add" id="crew-add" autocomplete="off">
      <input id="crew-name" type="text" placeholder="Sailor name" aria-label="Sailor name" autocapitalize="words" maxlength="30" enterkeyhint="done">
      <button class="addbtn" type="submit">Add</button>
    </form>
  </section>

  <section class="capture" aria-label="New capture">
    <label class="cap primary" id="cap-photo">
      <input class="file" type="file" id="in-photo" accept="image/*" capture="environment">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="4"/></svg>
      <div><b>Photo</b><span id="photo-sub">Boat from astern</span></div>
    </label>
    <label class="cap">
      <input class="file" type="file" id="in-video" accept="video/*" capture="environment">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="m16 10 6-3v10l-6-3z"/></svg>
      <div><b>Video</b><span>Tack, gybe, rounding, start</span></div>
    </label>
  </section>

  <p class="foot">Everything stays on this phone. After each shot, Save opens the share sheet: choose “Save to Files” and pick your sailing folder.</p>
</main>

<section class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet-head"><div class="wrap">
    <button class="link" id="cancel" type="button">Discard</button>
    <div class="sheet-title" id="sheet-title">Photo</div>
    <span style="min-width:72px"></span>
  </div></div>
  <div class="wrap">
    <div class="preview" id="preview"></div>

    <div class="sec" id="sec-man" hidden>
      <div class="lbl">Manoeuvre <span class="req" id="req-man">Required</span></div>
      <div class="chips big" id="man"></div>
    </div>

    <div class="sec" id="sec-crew">
      <div class="lbl">Sailors <span class="req" id="req-crew">Pick at least one</span></div>
      <div class="crew-pick" id="pick"></div>
      <div class="pick-note" id="pick-note" hidden></div>
    </div>

    <div class="sec">
      <div class="lbl">Wind (approx.)</div>
      <div class="wind">
        <div class="wind-read">
          <div class="kn" id="kn">12<small>kn</small></div>
          <div class="bft" id="bft">Beaufort 4<b>Moderate breeze</b></div>
        </div>
        <div class="wind-ctl">
          <button class="step" type="button" id="kn-minus" aria-label="Less wind">−</button>
          <input type="range" id="wind" min="0" max="40" step="1" value="12" aria-label="Wind in knots">
          <button class="step" type="button" id="kn-plus" aria-label="More wind">+</button>
        </div>
        <div class="scale"><span>0</span><span>10</span><span>20</span><span>30</span><span>40</span></div>
      </div>
    </div>

    <div class="sec"><div class="lbl">Wave height</div><div class="chips" id="wh"></div></div>
    <div class="sec"><div class="lbl">Sea state</div><div class="chips" id="ws"></div></div>

    <div class="fname-box"><div class="lbl">File name</div><div class="fname" id="fname"></div></div>
  </div>
  <div class="savebar"><div class="wrap">
    <div class="hint" id="hint"></div>
    <button class="save" id="save" type="button">Save to Files</button>
  </div></div>
  <input class="file" type="file" id="in-retake" accept="image/*" capture="environment">
</section>

<div class="toast" id="toast" hidden role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const MANS = ["Tack","Gybe","Top mark rounding","Bottom mark rounding","Start"];
const NO_SAILORS = new Set(["Start"]);
const WH = ["Flat","< 0.5 m","0.5–1 m","1–1.5 m","1.5–2 m","2 m +"];
const WS = ["Flat","Short chop","Long swell","Swell + chop","Confused"];
const BFT_NAMES = ["Calm","Light air","Light breeze","Gentle breeze","Moderate breeze","Fresh breeze","Strong breeze","Near gale","Gale","Strong gale"];
const BFT_TOP = [1,4,7,11,17,22,28,34,41];
const bft = kn => { let i = 0; while (i < BFT_TOP.length && kn >= BFT_TOP[i]) i++; return i; };

const ls = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ---------- file name ---------- */
const slug = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "")
  .replace(/</g, "lt").replace(/\+/g, "plus").replace(/[–—]/g, "-")
  .replace(/\s+/g, "-").replace(/[^A-Za-z0-9.\-]/g, "").replace(/-+/g, "-").replace(/^-|-$/g, "");
const pad = n => String(n).padStart(2, "0");
const dayKey = t => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
function extFor(file, kind){
  const t = (file && file.type) || "", n = (file && file.name) || "";
  const fromName = (n.match(/\.([A-Za-z0-9]{2,4})$/) || [])[1];
  const map = { "image/jpeg":"jpg", "image/heic":"heic", "image/heif":"heif", "image/png":"png", "video/quicktime":"mov", "video/mp4":"mp4", "video/webm":"webm" };
  return map[t] || (fromName ? fromName.toLowerCase() : (kind === "photo" ? "jpg" : "mov"));
}
function typeLabel(d){ return d.kind === "photo" ? "Photo" : (d.manoeuvre || "Video"); }
function serialKey(d){ return `wakelog.serial.${dayKey(d.createdAt)}.${slug(typeLabel(d))}`; }
function nextSerial(d){ return (ls.get(serialKey(d), 0) || 0) + 1; }
function fileName(d){
  const t = new Date(d.createdAt);
  const usesSailors = !(d.kind === "video" && NO_SAILORS.has(d.manoeuvre));
  const names = usesSailors ? d.sailors.map(id => (crew.find(s => s.id === id) || {}).name).filter(Boolean) : [];
  const parts = [slug(typeLabel(d))];
  if (names.length === 1) parts.push(slug(names[0]));
  else if (names.length > 1) parts.push(pad(nextSerial(d)));
  parts.push(dayKey(d.createdAt), `${pad(t.getHours())}${pad(t.getMinutes())}`, `${d.windKn}kn`,
             slug(d.waveHeight.replace(/\s+/g, "")), slug(d.waveState));
  return parts.filter(Boolean).join("_") + "." + extFor(d.file, d.kind);
}

/* ---------- crew (start screen only) ---------- */
let crew = ls.get("wakelog.crew", []);
let clearArmed = false;
function saveCrew(){ ls.set("wakelog.crew", crew); renderCrew(); }
function renderCrew(){
  const n = crew.length;
  $("#crew-count").textContent = n ? `${n} sailor${n === 1 ? "" : "s"}` : "";
  $("#crew-clear").hidden = !n;
  $("#crew-clear").textContent = clearArmed ? "Tap again to clear" : "Clear all";
  $("#crew-clear").classList.toggle("armed", clearArmed);
  $("#crew-list").innerHTML = n
    ? crew.map(s => `<div class="sailor"><b>${esc(s.name)}</b><button class="x" type="button" data-rm="${s.id}" aria-label="Remove ${esc(s.name)}">×</button></div>`).join("")
    : `<div class="crew-empty">Add today’s sailors here. After each photo or video you tap their names; you can’t add new ones there.</div>`;
  $("#cap-photo").classList.toggle("off", !n);
  $("#in-photo").disabled = !n;
  $("#photo-sub").textContent = n ? "Boat from astern" : "Add a sailor first";
}
$("#crew-add").addEventListener("submit", ev => {
  ev.preventDefault();
  const name = $("#crew-name").value.trim().replace(/\s+/g, " ");
  if (!name) { $("#crew-name").focus(); return; }
  if (!crew.some(s => s.name.toLowerCase() === name.toLowerCase())) crew.push({ id: newId(), name });
  $("#crew-name").value = ""; clearArmed = false; saveCrew(); $("#crew-name").focus();
});
$("#crew-list").addEventListener("click", e => {
  const b = e.target.closest("[data-rm]"); if (!b) return;
  crew = crew.filter(s => s.id !== b.dataset.rm); clearArmed = false; saveCrew();
});
$("#crew-clear").addEventListener("click", () => {
  if (!clearArmed) { clearArmed = true; renderCrew(); return; }
  clearArmed = false; crew = []; saveCrew();
});

/* ---------- capture → sheet ---------- */
const last = ls.get("wakelog.last", { windKn: 12, waveHeight: "0.5–1 m", waveState: "Short chop" });
let draft = null, discardArmed = false;

function startDraft(kind, file, keep){
  if (!file) return;
  if (draft && draft.url) URL.revokeObjectURL(draft.url);
  draft = Object.assign({ kind, file, createdAt: Date.now(), manoeuvre: null, sailors: [],
    windKn: last.windKn, waveHeight: last.waveHeight, waveState: last.waveState }, keep || {}, { kind, file });
  draft.url = URL.createObjectURL(file);
  discardArmed = false;
  fillSheet();
  $("#sheet").hidden = false; $("#sheet").scrollTop = 0; document.body.style.overflow = "hidden";
}
function bindCapture(input, kind){
  input.addEventListener("change", () => { const f = input.files && input.files[0]; input.value = ""; startDraft(kind, f); });
}
bindCapture($("#in-photo"), "photo");
bindCapture($("#in-video"), "video");
$("#in-retake").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0]; e.target.value = ""; if (!f || !draft) return;
  const { manoeuvre, sailors, windKn, waveHeight, waveState } = draft;
  startDraft(draft.kind, f, { manoeuvre, sailors, windKn, waveHeight, waveState, createdAt: Date.now() });
});

function chipRow(el, options, current, onPick, wideLast){
  el.innerHTML = "";
  options.forEach((o, i) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "chip";
    if (wideLast && i === options.length - 1) b.classList.add("wide");
    b.textContent = o; b.setAttribute("aria-pressed", String(o === current));
    b.addEventListener("click", () => { onPick(o); el.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c === b))); refresh(); });
    el.appendChild(b);
  });
}
function renderPick(){
  const el = $("#pick"); el.innerHTML = "";
  crew.forEach(s => {
    const b = document.createElement("button"); b.type = "button"; b.className = "pick";
    b.textContent = s.name; b.setAttribute("aria-pressed", String(draft.sailors.includes(s.id)));
    b.addEventListener("click", () => {
      draft.sailors = draft.sailors.includes(s.id) ? draft.sailors.filter(x => x !== s.id) : [...draft.sailors, s.id];
      b.setAttribute("aria-pressed", String(draft.sailors.includes(s.id))); refresh();
    });
    el.appendChild(b);
  });
}
function setWind(kn){
  kn = Math.max(0, Math.min(40, kn)); draft.windKn = kn;
  $("#wind").value = kn;
  $("#kn").innerHTML = kn + "<small>kn</small>";
  const b = bft(kn); $("#bft").innerHTML = "Beaufort " + b + "<b>" + BFT_NAMES[b] + "</b>";
  refresh();
}
function fillSheet(){
  const isV = draft.kind === "video";
  $("#sheet-title").textContent = isV ? "Video" : "Photo";
  $("#in-retake").accept = isV ? "video/*" : "image/*";
  $("#preview").innerHTML = (isV
    ? `<video src="${draft.url}" playsinline muted controls preload="metadata"></video>`
    : `<img src="${draft.url}" alt="Captured photo">`) + `<label class="retake" for="in-retake">Retake</label>`;
  $("#sec-man").hidden = !isV;
  if (isV) {
    chipRow($("#man"), MANS, draft.manoeuvre, v => draft.manoeuvre = v, true);
    if (!crew.length) $("#man").querySelectorAll(".chip").forEach(c => { if (!NO_SAILORS.has(c.textContent)) c.disabled = true; });
  }
  renderPick();
  chipRow($("#wh"), WH, draft.waveHeight, v => draft.waveHeight = v);
  chipRow($("#ws"), WS, draft.waveState, v => draft.waveState = v);
  $("#cancel").textContent = "Discard"; $("#cancel").classList.remove("armed");
  setWind(draft.windKn);
}
function needsSailors(){ return !(draft.kind === "video" && NO_SAILORS.has(draft.manoeuvre)); }
function refresh(){
  if (!draft) return;
  const isV = draft.kind === "video", needMan = isV && !draft.manoeuvre;
  const showCrew = !isV || (draft.manoeuvre && needsSailors());
  $("#sec-crew").hidden = !showCrew;
  const nSel = showCrew ? draft.sailors.filter(id => crew.some(s => s.id === id)).length : 0;
  const needCrew = showCrew && nSel === 0;
  $("#req-man").hidden = !needMan; $("#req-crew").hidden = !needCrew;
  $("#pick-note").hidden = nSel < 2;
  $("#pick-note").textContent = `${nSel} sailors selected: the file gets serial number ${pad(nextSerial(draft))} instead of names.`;
  let hint = "";
  if (needMan) hint = "Pick the manoeuvre";
  else if (needCrew) hint = "Pick a sailor";
  $("#hint").textContent = hint; $("#hint").hidden = !hint;
  $("#save").disabled = !!hint;
  $("#fname").textContent = needMan ? "Pick the manoeuvre to build the name" : fileName(draft);
}
$("#wind").addEventListener("input", e => setWind(+e.target.value));
$("#kn-minus").addEventListener("click", () => setWind(draft.windKn - 1));
$("#kn-plus").addEventListener("click", () => setWind(draft.windKn + 1));

function closeSheet(){
  $("#sheet").hidden = true; document.body.style.overflow = "";
  if (draft && draft.url) URL.revokeObjectURL(draft.url);
  draft = null;
}
$("#cancel").addEventListener("click", () => {
  if (!discardArmed) { discardArmed = true; $("#cancel").textContent = "Tap to confirm"; $("#cancel").classList.add("armed"); return; }
  closeSheet(); toast("Discarded");
});

$("#save").addEventListener("click", async () => {
  if (!draft || $("#save").disabled) return;
  const d = draft, name = fileName(d);
  const type = d.file.type || (d.kind === "photo" ? "image/jpeg" : "video/quicktime");
  const out = new File([d.file], name, { type });
  let ok = false;
  if (navigator.canShare && navigator.canShare({ files: [out] })) {
    try { await navigator.share({ files: [out] }); ok = true; }
    catch (err) { if (err && err.name === "AbortError") { toast("Not saved yet – tap Save to Files again"); return; } }
  }
  if (!ok) {
    try {
      const a = document.createElement("a"); a.href = URL.createObjectURL(out); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 60000); ok = true;
    } catch { toast("Couldn’t save this file on this phone"); return; }
  }
  const usesSerial = needsSailors() && d.sailors.length > 1;
  if (usesSerial) ls.set(serialKey(d), nextSerial(d));
  Object.assign(last, { windKn: d.windKn, waveHeight: d.waveHeight, waveState: d.waveState });
  ls.set("wakelog.last", last);
  closeSheet(); toast("Saved " + name);
});

let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }

renderCrew();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
